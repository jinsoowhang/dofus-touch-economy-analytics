version: 2

models:
  - name: dim_items
    description: "Grain: one canonical catalog item."
    columns:
      - name: item_id
        data_tests: [not_null, unique]
      - name: display_name
        data_tests: [not_null]
      - name: weight
        description: "Dofus Touch carrying weight in pods; null when no live catalog match exists."
      - name: touch_catalog_status
        description: >-
          Latest live Dofus Touch membership result; excluded rows remain in the
          analytical dimension for provenance even though the website hides them.
      - name: touch_catalog_checked_at
        description: "UTC timestamp of the latest live Dofus Touch membership check."
      - name: touch_catalog_exclusion_reason
        description: "Reason retained for an item excluded from website catalog surfaces."

  - name: fct_price_observations
    description: "Grain: one valid or invalidated observed item price."
    columns:
      - name: price_observation_id
        data_tests: [not_null, unique]
      - name: item_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_items')
                field: item_id

  - name: fct_sales
    description: "Grain: one active or completed Sales listing."
    columns:
      - name: sale_listing_id
        data_tests: [not_null, unique]
      - name: item_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_items')
                field: item_id
      - name: recipe_cost_at_sale
        description: "Fixed recipe ingredient cost captured when the listing was sold."
      - name: profit_at_sale
        description: "Realized asking price minus the fixed recipe cost at sale."
      - name: listing_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'sold']

  - name: fct_recipe_ingredients
    description: >-
      Grain: one ordered ingredient position in the latest recipe for each crafted item.
      Unresolved ingredients remain explicit through a null ingredient_item_id.
    columns:
      - name: recipe_id
        data_tests: [not_null]
      - name: crafted_item_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_items')
                field: item_id
      - name: ingredient_position
        data_tests: [not_null]
      - name: ingredient_item_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_items')
                field: item_id

  - name: fct_recipe_economics
    description: >-
      Grain: one crafted item using its latest recipe per observed market context.
      This current-state fact exposes governed price coverage, complete recipe cost,
      estimated profit, and estimated return on investment for analytical consumers.
    columns:
      - name: recipe_id
        data_tests: [not_null]
      - name: crafted_item_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_items')
                field: item_id
      - name: market_context
        data_tests: [not_null]
      - name: ingredient_count
        data_tests: [not_null]
      - name: price_coverage_ratio
        description: Priced ingredient positions divided by all ingredient positions.
        data_tests: [not_null]
      - name: cost_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['complete', 'missing_price', 'unresolved_ingredient']
      - name: recipe_cost
        description: Complete current ingredient cost; null for incomplete recipes.
      - name: current_item_unit_price
        description: Latest valid per-unit observation for the crafted item and market.
      - name: estimated_profit
        description: Current item unit price minus complete recipe cost.
      - name: estimated_return_on_investment
        description: Estimated profit divided by complete recipe cost, expressed as a ratio.
