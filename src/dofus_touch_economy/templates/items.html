{% extends "base.html" %}
{% block title %}Item Search · Dofus Touch Economy{% endblock %}
{% block content %}
  <h1>Item Search</h1>
  <p>Market: {{ market_context }}</p>
  {% if notification %}
    <p class="notification" role="status">{{ notification }}</p>
  {% endif %}
  <form method="get" action="/items" class="search-form">
    <label for="item-query">Item Name</label>
    <input type="hidden" name="sort" value="{{ sort_field }}">
    <input type="hidden" name="direction" value="{{ sort_direction }}">
    <input
      id="item-query"
      name="q"
      value="{{ query }}"
      autocomplete="off"
      hx-get="/items"
      hx-trigger="input changed delay:250ms, search"
      hx-target="#item-results"
      hx-indicator="#search-indicator"
    >
    <button type="submit">Search</button>
    <span id="search-indicator" class="htmx-indicator" role="status">Searching…</span>
  </form>
  <div id="item-results">
    {% include "fragments/item_results.html" %}
  </div>
{% endblock %}
