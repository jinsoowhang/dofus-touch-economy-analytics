{% extends "base.html" %}
{% block title %}Item search · Dofus Touch Economy{% endblock %}
{% block content %}
  <h1>Item search</h1>
  <p>Market: {{ market_context }}</p>
  <form method="get" action="/items">
    <label for="item-query">Item name</label>
    <input id="item-query" name="q" value="{{ query }}" autocomplete="off">
    <button type="submit">Search</button>
  </form>
  <section id="item-results">
    {% include "fragments/item_results.html" %}
  </section>
{% endblock %}
