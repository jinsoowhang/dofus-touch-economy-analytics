<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Dofus Touch Economy{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css?v=20260906-profit-line">
    <script src="/static/htmx.min.js" defer></script>
    <script src="/static/table-sort.js" defer></script>
    <script src="/static/site-navigation.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a href="/" class="site-brand">Dofus Touch Economy</a>
        <nav class="site-tabs" aria-label="Primary navigation">
          <a href="/" class="site-tab{% if active_tab == 'home' %} is-active{% endif %}"{% if active_tab == 'home' %} aria-current="page"{% endif %}>Home</a>
          <details class="site-menu">
            <summary
              class="site-tab{% if active_tab in ['items', 'price_priorities', 'recipes', 'recipe_calculator'] %} is-active{% endif %}"
            >
              <span>Item</span>
              <span class="site-menu-caret" aria-hidden="true">&#9662;</span>
            </summary>
            <div class="site-submenu" role="group" aria-label="Item navigation">
              <a
                href="/items"
                class="site-submenu-link{% if active_tab == 'items' %} is-active{% endif %}"
                {% if active_tab == "items" %}aria-current="page"{% endif %}
              >Item Search</a>
              <a
                href="/price-priorities"
                class="site-submenu-link{% if active_tab == 'price_priorities' %} is-active{% endif %}"
                {% if active_tab == "price_priorities" %}aria-current="page"{% endif %}
              >Price Priorities</a>
              <a
                href="/recipe-calculator"
                class="site-submenu-link{% if active_tab == 'recipe_calculator' %} is-active{% endif %}"
                {% if active_tab == "recipe_calculator" %}aria-current="page"{% endif %}
              >Recipe Calculator</a>
              <a
                href="/recipes"
                class="site-submenu-link{% if active_tab == 'recipes' %} is-active{% endif %}"
                {% if active_tab == "recipes" %}aria-current="page"{% endif %}
              >Recipes</a>
            </div>
          </details>
          <details class="site-menu">
            <summary
              class="site-tab{% if active_tab in ['sales', 'price_review', 'profit_opportunities', 'best_sellers', 'out_of_stock'] %} is-active{% endif %}"
            >
              <span>Sales</span>
              <span class="site-menu-caret" aria-hidden="true">&#9662;</span>
            </summary>
            <div class="site-submenu" role="group" aria-label="Sales navigation">
              <a
                href="/sales"
                class="site-submenu-link{% if active_tab == 'sales' %} is-active{% endif %}"
                {% if active_tab == "sales" %}aria-current="page"{% endif %}
              >Activity</a>
              <a
                href="/best-sellers"
                class="site-submenu-link{% if active_tab == 'best_sellers' %} is-active{% endif %}"
                {% if active_tab == "best_sellers" %}aria-current="page"{% endif %}
              >Best Sellers</a>
              <a
                href="/out-of-stock-items"
                class="site-submenu-link{% if active_tab == 'out_of_stock' %} is-active{% endif %}"
                {% if active_tab == "out_of_stock" %}aria-current="page"{% endif %}
              >Out of Stock Items</a>
              <a
                href="/sales/price-review"
                class="site-submenu-link{% if active_tab == 'price_review' %} is-active{% endif %}"
                {% if active_tab == "price_review" %}aria-current="page"{% endif %}
              >Price Review</a>
              <a
                href="/profit-opportunities"
                class="site-submenu-link{% if active_tab == 'profit_opportunities' %} is-active{% endif %}"
                {% if active_tab == "profit_opportunities" %}aria-current="page"{% endif %}
              >Profit Opportunities</a>
            </div>
          </details>
          <details class="site-menu">
            <summary class="site-tab{% if active_tab in ['bigquery_sync', 'dashboard', 'insights'] %} is-active{% endif %}">
              <span>Data</span>
              <span class="site-menu-caret" aria-hidden="true">&#9662;</span>
            </summary>
            <div class="site-submenu" role="group" aria-label="Data navigation">
              <a href="/bigquery-sync" class="site-submenu-link{% if active_tab == 'bigquery_sync' %} is-active{% endif %}"{% if active_tab == 'bigquery_sync' %} aria-current="page"{% endif %}>BigQuery Sync</a>
              <a href="/dashboard" class="site-submenu-link{% if active_tab == 'dashboard' %} is-active{% endif %}"{% if active_tab == 'dashboard' %} aria-current="page"{% endif %}>Dashboard</a>
              <a href="/insights" class="site-submenu-link{% if active_tab == 'insights' %} is-active{% endif %}"{% if active_tab == 'insights' %} aria-current="page"{% endif %}>Insights</a>
            </div>
          </details>
        </nav>
      </div>
    </header>
    <main class="page-shell{% if active_tab in ['price_priorities', 'price_review', 'recipes', 'recipe_calculator', 'profit_opportunities', 'best_sellers', 'out_of_stock', 'insights', 'dashboard'] %} page-shell--wide{% endif %}">
      {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
  </body>
</html>
