<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Dofus Touch Economy{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/htmx.min.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a href="/items" class="site-brand">Dofus Touch Economy</a>
        <nav class="site-tabs" aria-label="Primary navigation">
          <details class="site-menu">
            <summary
              class="site-tab{% if active_tab in ['items', 'recipes', 'recipe_calculator'] %} is-active{% endif %}"
            >
              <span>Item</span>
              <span class="site-menu-caret" aria-hidden="true">&#9662;</span>
            </summary>
            <div class="site-submenu" role="group" aria-label="Item navigation">
              <a
                href="/items"
                class="site-submenu-link{% if active_tab == 'items' %} is-active{% endif %}"
                {% if active_tab == "items" %}aria-current="page"{% endif %}
              >Item Search</a>
              <a
                href="/recipes"
                class="site-submenu-link{% if active_tab == 'recipes' %} is-active{% endif %}"
                {% if active_tab == "recipes" %}aria-current="page"{% endif %}
              >Recipes</a>
              <a
                href="/recipe-calculator"
                class="site-submenu-link{% if active_tab == 'recipe_calculator' %} is-active{% endif %}"
                {% if active_tab == "recipe_calculator" %}aria-current="page"{% endif %}
              >Recipe Calculator</a>
            </div>
          </details>
          <a
            href="/sales"
            class="site-tab{% if active_tab == 'sales' %} is-active{% endif %}"
            {% if active_tab == "sales" %}aria-current="page"{% endif %}
          >Sales</a>
          <a
            href="/bigquery-sync"
            class="site-tab{% if active_tab == 'bigquery_sync' %} is-active{% endif %}"
            {% if active_tab == "bigquery_sync" %}aria-current="page"{% endif %}
          >BigQuery Sync</a>
        </nav>
      </div>
    </header>
    <main class="page-shell{% if active_tab == 'recipes' %} page-shell--wide{% endif %}">
      {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
  </body>
</html>
