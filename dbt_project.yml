name: dofus_touch_economy_analytics
version: 1.0.0
config-version: 2

profile: dofus_touch_economy_analytics

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests/dbt"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages
  - logs

models:
  dofus_touch_economy_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  dofus_touch_economy_analytics:
    local_operational:
      +enabled: "{{ target.type == 'duckdb' }}"
